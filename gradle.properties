org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Reintentos con espera progresiva al descargar dependencias -- ver Doc/48.
# El primer intento de generar el Baseline Profile falló con
# "Received status code 429 from server: Too Many Requests" de Maven
# Central (org.hamcrest, kotlinx-coroutines-core, wire-runtime, etc.): el
# módulo :baselineprofile es nuevo, así que resolvió TODAS sus dependencias
# de golpe sin nada en caché todavía, y Maven Central le cortó el paso
# temporalmente al runner de GitHub Actions -- no es una versión de
# dependencia inexistente, es un límite del servidor. Estas dos propiedades
# son la mitigación real documentada por Gradle para ese código de error
# exacto: reintenta la descarga hasta 10 veces con una espera inicial de
# 500ms (creciente entre intento e intento) en vez de rendirse al primer 429.
systemProp.org.gradle.internal.repository.max.tentatives=10
systemProp.org.gradle.internal.repository.initial.backoff=500
