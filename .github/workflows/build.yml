name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure required Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.6

      - name: Run unit tests (DWP engine, verified against real Instrument.dwp)
        run: gradle testDebugUnitTest --stacktrace

      - name: Summarize test results (from real JUnit XML reports)
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          files = sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml"))
          if not files:
              print("::error::No JUnit XML reports found under app/build/test-results/testDebugUnitTest/")
              print("Tests detected: 0")
              print("Tests executed: 0")
              print("Tests passed: 0")
              print("Tests failed: 0")
              print("Tests skipped: 0")
              print("BUILD FAILED (no test reports produced)")
              sys.exit(1)

          total = failures = errors = skipped = 0
          for f in files:
              root = ET.parse(f).getroot()
              total += int(root.attrib.get("tests", 0))
              failures += int(root.attrib.get("failures", 0))
              errors += int(root.attrib.get("errors", 0))
              skipped += int(root.attrib.get("skipped", 0))

          executed = total - skipped
          passed = executed - failures - errors
          failed = failures + errors

          print(f"Test report files parsed: {len(files)}")
          print(f"Tests detected: {total}")
          print(f"Tests executed: {executed}")
          print(f"Tests passed: {passed}")
          print(f"Tests failed: {failed}")
          print(f"Tests skipped: {skipped}")
          print("BUILD FAILED (tests)" if failed > 0 else "BUILD SUCCESSFUL (tests)")

          sys.exit(1 if failed > 0 else 0)
          PY

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace


      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DwpCreator-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
