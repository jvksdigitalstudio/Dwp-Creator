name: Startup Benchmark

# Benchmark de arranque en frío: sin perfil vs con Baseline Profile vs compilado completo (Doc/69).
# Como `baseline-profile.yml`, SOLO se dispara a mano (`workflow_dispatch`): no forma parte de Build APK
# ni puede afectar al APK que se distribuye.
on:
  workflow_dispatch:

jobs:
  startup-benchmark:
    runs-on: ubuntu-24.04
    # Doc/58: con Gradle Managed Devices (Docs 54-57) el error real
    # `Unable to confirm activity launch completion` persistió incluso
    # desactivando animaciones -- causa conocida: el emulador de GMD, en
    # este entorno, no da suficiente control sobre el renderizado gráfico
    # (no se puede pasar `-gpu swiftshader_indirect`, la mitigación real
    # para ese error en emuladores sin GPU física). Este workflow usa en su
    # lugar `reactivecircus/android-emulator-runner`, el mecanismo estándar
    # que usa la mayoría de proyectos Android reales en GitHub Actions para
    # pruebas instrumentadas -- sí permite pasar esas opciones.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure required Android SDK packages
        # Solo lo que Gradle necesita para COMPILAR -- el emulador en sí
        # ahora lo arranca y gestiona `reactivecircus/android-emulator-runner`
        # por su cuenta, con su propia imagen de sistema.
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.6

      # Habilita KVM (virtualización por hardware) en el runner de GitHub --
      # sigue haciendo falta con este mecanismo también, lo recomienda la
      # propia documentación de la Action de abajo.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Arranca un emulador real, lo conecta por adb (Gradle lo ve como
      # "dispositivo conectado", no uno gestionado por sí mismo -- ver
      # `useConnectedDevices = true` en `app/build.gradle.kts`) y ejecuta la
      # generación del perfil DENTRO de esa misma sesión, mientras el
      # emulador sigue vivo. `-gpu swiftshader_indirect` es la mitigación
      # real, documentada, para el error `Unable to confirm activity launch
      # completion` en emuladores sin aceleración gráfica por hardware.
      # Ejecuta SOLO `StartupBenchmark` (filtro por clase) sobre la variante `benchmarkRelease` de la app.
      # `suppressErrors=EMULATOR,LOW-BATTERY`: Macrobenchmark se niega a medir en emulador sin esto; aquí
      # sólo importa la comparación RELATIVA entre los tres modos (ver KDoc de StartupBenchmark).
      - name: Run startup benchmark
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          disable-spellchecker: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: gradle :baselineprofile:connectedBenchmarkReleaseAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.jvk.dwpcreator.baselineprofile.StartupBenchmark -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR,LOW-BATTERY --stacktrace

      # Lee los JSON reales que deja Macrobenchmark y publica una tabla comparativa en el resumen de la corrida.
      - name: Summarize startup benchmark
        if: always()
        run: |
          python3 - <<'PY'
          import glob, json, os
          files = sorted(glob.glob("baselineprofile/build/**/*benchmarkData.json", recursive=True))
          out = []
          if not files:
              print("::warning::No benchmarkData.json produced")
              out.append("No benchmark data produced (see the job log).")
          rows = {}
          for f in files:
              data = json.load(open(f))
              for b in data.get("benchmarks", []):
                  rows[b["name"]] = b.get("metrics", {})
          labels = [("startupWithoutProfile", "Sin perfil (CompilationMode.None)"),
                    ("startupWithBaselineProfile", "Con Baseline Profile"),
                    ("startupFullyCompiled", "Compilado completo (techo)")]
          def med(name, metric):
              m = rows.get(name, {}).get(metric)
              return m["median"] if m else None
          for metric, title in (("timeToInitialDisplayMs", "Tiempo hasta el primer frame (TTID)"),
                                ("timeToFullDisplayMs", "Tiempo hasta pantalla completa (reportFullyDrawn)")):
              if not any(med(n, metric) is not None for n, _ in labels):
                  continue
              base = med("startupWithoutProfile", metric)
              out.append(f"### {title}")
              out.append("| Modo | min ms | mediana ms | max ms | vs sin perfil |")
              out.append("|---|---:|---:|---:|---:|")
              for name, label in labels:
                  m = rows.get(name, {}).get(metric)
                  if not m:
                      out.append(f"| {label} | - | - | - | - |")
                      continue
                  delta = "-" if (base is None or name == "startupWithoutProfile") else f"{(m['median']-base)/base*100:+.1f} %"
                  out.append(f"| {label} | {m['minimum']:.0f} | {m['median']:.0f} | {m['maximum']:.0f} | {delta} |")
              out.append("")
          out.append("_Medido en un emulador x86_64 de CI, 10 arranques en frio por modo: valen las diferencias relativas, no las cifras absolutas de un telefono._")
          text = "\n".join(out)
          print(text)
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(text + "\n")
          PY

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-benchmark
          path: |
            baselineprofile/build/outputs/connected_android_test_additional_output/**
            baselineprofile/build/outputs/androidTest-results/**
          if-no-files-found: warn
